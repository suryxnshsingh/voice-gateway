[project]
name = "voicegw"
version = "0.1.0"
description = "Real-time voice gateway: STT, LLM, cloned-voice TTS and tone over one WebSocket"
authors = [
    { name = "suryxnshsingh", email = "suryxnshsingh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
    "pyrnnoise>=0.4.5",
    "python-multipart>=0.0.32",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
voicegw = "voicegw.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
