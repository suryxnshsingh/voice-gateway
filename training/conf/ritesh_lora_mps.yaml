# Paths are relative to training/ (run the trainer from there).
# LoRA fine-tune of VoxCPM2 on Ritesh Sir (23.5 min, 136 clips), Apple M5 Pro, PyTorch MPS fp32.
# Values from the official LoRA config with steps/warmup/intervals scaled to a small single-speaker set
# (docs: small datasets overfit within a few hundred steps; evaluate checkpoints 100-400).
pretrained_path: openbmb/VoxCPM2   # HF repo id (downloaded/cached), or a local snapshot dir
train_manifest: datasets/ritesh/train_final.jsonl
val_manifest: datasets/ritesh/val_final.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 8
num_workers: 0
preprocessing_num_workers: 1
num_iters: 400
max_steps: 400
log_interval: 5
valid_interval: 50
save_interval: 50
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 30
max_batch_tokens: 600
max_grad_norm: 1.0
save_path: ckpt/ritesh_r32
tensorboard: ckpt/ritesh_r32/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
